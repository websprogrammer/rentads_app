
<html>
<head>
    <style>
        table {
            font-family: "Lucida Sans Unicode", "Lucida Grande", Sans-Serif, serif;
            border-collapse: collapse;
            color: #686461;
            width: 700px;
        }
        caption {
            padding: 10px;
            color: white;
            background: #8FD4C1;
            font-size: 18px;
            text-align: left;
            font-weight: bold;
        }
        th {
            border-bottom: 3px solid #B9B29F;
            padding: 10px;
            text-align: center;
        }
        td {
            padding: 10px;
            text-align: center;
        }
        tr:nth-child(odd) {
            background: white;
        }
        tr:nth-child(even) {
            background: #E8E6D1;
        }
        .btn {
            display: inline-block;
            box-sizing: border-box;
            padding: 1px;
            margin: 0 12px 12px 0;
            outline: none;
            border: 1px solid #F18230;
            border-radius: 25px;
            height: 46px;
            line-height: 0;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: #fff;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            vertical-align: top;
            cursor: pointer;
            user-select: none;
            appearance: none;
            touch-action: manipulation;
        }
        .btn span {
            display: block;
            box-sizing: border-box;
            padding: 0 25px;
            height: 42px;
            line-height: 38px;
            border: 1px solid #F18230;
            border-radius: 25px;
            font-size: 14px;
            color: #FFFFFF;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%), #F18230;
            text-align: center;
            font-weight: 600;
        }
        .btn:focus-visible {
            box-shadow: 0 0 0 3px lightskyblue;
        }
        .btn:hover span {
            background-color: #fba768
        }
        .btn:active span {
            background-color: #c17237 !important;
        }
        .btn:disabled {
            opacity: 0.65;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>{{.Title}}</h1>
    <table>
        <caption>{{.Title}}</caption>
        <tr>
            <th>PostId</th>
            <th>City</th>
            <th>Type</th>
            <th>Message</th>
            <th>Modify</th>
        </tr>
        {{range .Feedbacks}}
            <tr>
                <td>{{.PostId}}</td>
                <td>{{.City}}</td>
                <td>{{.FeedbackType}}</td>
                <td>
                    {{if .Message }}
                        {{.Message}}
                    {{else}}&nbsp;{{end}}
                </td>
                <td>
                    <a class="btn" href="/delete_feedback?feedback_id={{.Id}}"><span>Delete</span></a>
                </td>
            </tr>
        {{end}}
    </table>

<script type="text/javascript">

</script>




</body>
</html>
